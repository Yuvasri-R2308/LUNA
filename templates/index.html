<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LUNA - Personal Healthcare Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #ffffff;
            color: #000000;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .sidebar {
            width: 260px;
            background: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2d2d2d;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #2d2d2d;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background: transparent;
            border: 1px solid #4d4d4d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: #2d2d2d;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid #2d2d2d;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-info:hover {
            background: #2d2d2d;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: #4d4d4d;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        .chat-header {
            height: 60px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }

        .model-selector {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .model-selector:hover {
            background: #f7f7f7;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #d1d1d1;
            border-radius: 4px;
        }

        .messages-wrapper {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }

        .message-group {
            display: flex;
            gap: 16px;
            padding: 24px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .user-message .message-avatar {
            background: #000000;
            color: #ffffff;
        }

        .assistant-message .message-avatar {
            background: #f0f0f0;
            color: #000000;
        }

        .message-content {
            flex: 1;
            padding-top: 8px;
        }

        .message-role {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #000000;
        }

        .message-text {
            font-size: 15px;
            line-height: 1.7;
            color: #1a1a1a;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .input-section {
            border-top: 1px solid #e5e5e5;
            background: #ffffff;
            padding: 20px;
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .input-container {
            display: flex;
            align-items: flex-end;
            background: #f7f7f7;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.2s;
        }

        .input-container:focus-within {
            background: #ffffff;
            border-color: #b4b4b4;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        textarea {
            flex: 1;
            border: none;
            background: transparent;
            resize: none;
            outline: none;
            font-size: 15px;
            line-height: 1.5;
            font-family: inherit;
            color: #000000;
            min-height: 24px;
            max-height: 200px;
        }

        textarea::placeholder {
            color: #8c8c8c;
        }

        .send-button {
            width: 32px;
            height: 32px;
            background: #000000;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 12px;
            flex-shrink: 0;
            transition: opacity 0.2s;
        }

        .send-button:hover:not(:disabled) {
            opacity: 0.8;
        }

        .send-button:disabled {
            background: #e5e5e5;
            cursor: not-allowed;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px;
            text-align: center;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #000000;
        }

        .welcome-subtitle {
            font-size: 16px;
            color: #666666;
            margin-bottom: 40px;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            max-width: 800px;
            width: 100%;
        }

        .suggestion-card {
            padding: 16px;
            background: #f7f7f7;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .suggestion-card:hover {
            background: #ffffff;
            border-color: #000000;
        }

        .suggestion-title {
            font-size: 14px;
            font-weight: 500;
            color: #000000;
            margin-bottom: 4px;
        }

        .suggestion-text {
            font-size: 13px;
            color: #666666;
        }

        .typing-indicator {
            display: none;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #b4b4b4;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
            }
            30% {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .messages-wrapper {
                padding: 20px 16px;
            }

            .input-section {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<div class="app-container">
    <div class="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="newChat()">
                <span>+</span>
                <span>New chat</span>
            </button>
        </div>
        <div class="sidebar-content"></div>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">U</div>
                <div class="user-name">User</div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-header">
            <button class="model-selector">
                <span>LUNA Healthcare Assistant</span>
                <span>▼</span>
            </button>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="messages-wrapper">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-title">LUNA</div>
                    <div class="welcome-subtitle">Your Personal Healthcare Assistant</div>
                    <div class="suggestions">
                        <div class="suggestion-card" onclick="useSuggestion('What are the symptoms of the flu?')">
                            <div class="suggestion-title">Symptoms</div>
                            <div class="suggestion-text">Learn about common symptoms</div>
                        </div>
                        <div class="suggestion-card" onclick="useSuggestion('How can I improve my sleep quality?')">
                            <div class="suggestion-title">Sleep Health</div>
                            <div class="suggestion-text">Tips for better sleep</div>
                        </div>
                        <div class="suggestion-card" onclick="useSuggestion('What should I know about blood pressure?')">
                            <div class="suggestion-title">Blood Pressure</div>
                            <div class="suggestion-text">Understanding your readings</div>
                        </div>
                        <div class="suggestion-card" onclick="useSuggestion('Explain medication side effects')">
                            <div class="suggestion-title">Medications</div>
                            <div class="suggestion-text">Side effects and interactions</div>
                        </div>
                    </div>
                </div>
                <div id="messages"></div>
            </div>
        </div>

        <div class="input-section">
            <div class="input-wrapper">
                <div class="input-container">
                    <textarea 
                        id="messageInput" 
                        placeholder="Message LUNA..." 
                        rows="1"
                        onkeydown="handleKeyPress(event)"
                        oninput="adjustTextareaHeight()"
                    ></textarea>
                    <button class="send-button" id="sendBtn" onclick="sendMessage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M7 11L12 6L17 11M12 18V7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const chatContainer = document.getElementById("chatContainer");
    const messagesDiv = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const welcomeScreen = document.getElementById("welcomeScreen");

    function adjustTextareaHeight() {
        messageInput.style.height = 'auto';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 200) + 'px';
    }

    function handleKeyPress(event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    function useSuggestion(text) {
        messageInput.value = text;
        messageInput.focus();
        sendMessage();
    }

    function newChat() {
        messagesDiv.innerHTML = '';
        welcomeScreen.style.display = 'flex';
        messageInput.value = '';
        messageInput.focus();
    }

    function sendMessage() {
        let message = messageInput.value.trim();
        if (message === "") return;

        if (welcomeScreen.style.display !== 'none') {
            welcomeScreen.style.display = 'none';
        }

        messagesDiv.innerHTML += `
            <div class="message-group user-message">
                <div class="message-avatar">U</div>
                <div class="message-content">
                    <div class="message-role">You</div>
                    <div class="message-text">${escapeHtml(message)}</div>
                </div>
            </div>
        `;

        const typingGroup = document.createElement('div');
        typingGroup.className = 'message-group assistant-message';
        typingGroup.innerHTML = `
            <div class="message-avatar">L</div>
            <div class="message-content">
                <div class="message-role">LUNA</div>
                <div class="typing-indicator active">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
        `;
        messagesDiv.appendChild(typingGroup);

        chatContainer.scrollTop = chatContainer.scrollHeight;

        messageInput.value = "";
        messageInput.style.height = 'auto';
        sendBtn.disabled = true;

        fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message: message })
        })
        .then(response => response.json())
        .then(data => {
            typingGroup.remove();
            messagesDiv.innerHTML += `
                <div class="message-group assistant-message">
                    <div class="message-avatar">L</div>
                    <div class="message-content">
                        <div class="message-role">LUNA</div>
                        <div class="message-text">${escapeHtml(data.reply)}</div>
                    </div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            sendBtn.disabled = false;
            messageInput.focus();
        })
        .catch(error => {
            typingGroup.remove();
            messagesDiv.innerHTML += `
                <div class="message-group assistant-message">
                    <div class="message-avatar">!</div>
                    <div class="message-content">
                        <div class="message-role">System</div>
                        <div class="message-text">Unable to connect to server. Please try again.</div>
                    </div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            sendBtn.disabled = false;
            messageInput.focus();
        });
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    window.addEventListener('load', () => {
        messageInput.focus();
    });
</script>

</body>
</html>
